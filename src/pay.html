<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#FBF8F2" data-dark="#0B1512">
  {{include:theme-head}}
  {{include:api-preconnect}}
  <title>{{seo.pay.title}}</title>
  <meta name="description" content="{{seo.pay.description}}">
  <meta name="robots" content="noindex, nofollow">

  <!-- Open Graph (the link is shared on WhatsApp) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{seo.pay.title}}">
  <meta property="og:description" content="{{seo.pay.description}}">
  <meta property="og:image" content="assets/img/{{seo.pay.ogImage}}">

  <!-- Preload Critical Fonts -->
  <link rel="preload" href="assets/fonts/cormorant-garamond-600.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/inter-600.woff2" as="font" type="font/woff2" crossorigin>

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/print.css" media="print">

  <!-- Scripts -->
  <script src="js/config.js" defer></script>
  <script src="js/content.ui.js" defer></script>
  <script src="js/api.js" defer></script>
  <script src="js/api.link.js" defer></script>
  <script src="js/payment.js" defer></script>
  <script src="js/site.js" defer></script>
  <script src="js/pay.js" defer></script>
  <script src="js/reviews.js" defer></script>
  <script type="application/json" id="pay-text">{{pay}}</script>
  <script type="application/json" id="reviews-text">{{reviews}}</script>
  <script src="js/theme.js" defer></script>
</head>
<body class="page-pay">
  <a href="#main-content" class="skip-link">{{copy.common.skipToMainContent}}</a>

  {{include:header}}

  <!-- Icon sprite (stroke icons, currentColor) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-list" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/></symbol>
    <symbol id="i-upi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M9 17h6"/><path d="M12 6v7m-2.5-2.5L12 13l2.5-2.5"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-hourglass" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h12M6 22h12M7 2v4l5 6-5 6v4M17 2v4l-5 6 5 6v4"/></symbol>
    <symbol id="i-cross" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/></symbol>
    <symbol id="i-people" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="2.5"/><path d="M16 15.5a5 5 0 0 1 5.5 4.5"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 3l9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m-5-5 5 5 5-5"/><path d="M4 17v3h16v-3"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 22s7-7 7-12a7 7 0 0 0-14 0c0 5 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></symbol>
    <symbol id="i-wa" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="m12 2 2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.3l-6.1 3.3 1.4-6.8L2.2 9.1l6.9-.8z"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></symbol>
  </svg>

  <main id="main-content" class="pay-main">
    <div class="container">
      <div class="pay-wrap">
        <ol class="pay-steps" id="pay-steps" aria-label="Booking progress">
          <!--each:pay.steps-->
          <li class="pay-step"><span class="pay-step-icon"><svg width="20" height="20" aria-hidden="true"><use href="#{{.icon}}"/></svg></span><span class="pay-step-label">{{.label}}</span></li>
          <!--/each-->
        </ol>

        <h1 class="pay-title" id="pay-title">{{pay.title}}</h1>
        <div id="pay-app" class="pay-app" aria-live="polite" data-reviews-watch data-directions="{{home.location.directionsUrl}}" data-address="{{site.address}}">
          <div class="pay-loading nsg-loading" role="status">{{include:loader}}<p>{{pay.loading}}</p></div>
        </div>
      </div>
    </div>
  </main>

  <template id="svc-booking-tpl">{{include:services-booking}}</template>
  {{include:svc-icons}}
  <a class="pay-help no-print" id="pay-help" href="contact.html" hidden>
    <svg width="22" height="22" aria-hidden="true"><use href="#i-wa"/></svg><span>{{pay.help}}</span>
  </a>

  {{include:footer}}
</body>
</html>
