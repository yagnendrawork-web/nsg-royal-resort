<!-- Theme before CSS: saved choice (localStorage nsg_theme) or the system setting; no flash. theme.js handles the toggle. -->
<script>(function(){var d=document.documentElement,t=null;try{t=localStorage.getItem('nsg_theme')}catch(e){}if(t!=='light'&&t!=='dark')t=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';d.setAttribute('data-theme',t);var m=document.querySelector('meta[name="theme-color"]');if(m){m.setAttribute('data-light',m.getAttribute('content'));if(t==='dark')m.setAttribute('content',m.getAttribute('data-dark')||'#0B1512')}})();</script>
