<header class="site-header" id="site-header">
  <div class="container header-container">
    <a href="index.html" class="header-brand" aria-label="{{site.name}} Home">
      <img src="assets/img/logo-md.png" alt="{{site.name}}" class="header-logo" width="160" height="160">
    </a>

    <nav class="header-nav" id="header-nav" aria-label="Main Navigation">
      <div class="nav-capsule">
        <span class="nav-indicator" aria-hidden="true"></span>
        <ul class="nav-list">
          <li><a href="stay.html" class="nav-link">{{copy.common.stay}}</a></li>
          <li><a href="amenities.html" class="nav-link">{{copy.common.amenities}}</a></li>
          <li><a href="dining.html" class="nav-link">{{copy.common.dining}}</a></li>
          <li><a href="events.html" class="nav-link">{{copy.common.events}}</a></li>
          <li><a href="gallery.html" class="nav-link">{{copy.common.gallery}}</a></li>
          <li><a href="contact.html" class="nav-link">{{copy.common.contact}}</a></li>
          <li><a href="policies.html" class="nav-link">{{copy.common.policies}}</a></li>
        </ul>
      </div>
      <div class="mobile-menu-actions">
        <a href="https://wa.me/{{config.WHATSAPP}}" class="mobile-menu-pill" target="_blank" rel="noopener noreferrer">{{contact.whatsapp}}</a>
        <a href="tel:{{config.PHONE}}" class="mobile-menu-pill">{{contact.call}}</a>
        <a href="book.html" class="btn btn-primary btn-lg mobile-cta">{{ui.buttons.bookNow}}</a>
      </div>
    </nav>

    <div class="header-actions">
      <a href="book.html" class="btn btn-primary btn-sm header-book">{{ui.buttons.bookNow}}</a>
      <button type="button" class="menu-toggle" aria-controls="header-nav" aria-expanded="false" aria-label="Toggle navigation menu">
        <span class="menu-toggle-icon" aria-hidden="true">
          <span class="menu-toggle-bar"></span>
          <span class="menu-toggle-bar"></span>
          <span class="menu-toggle-bar"></span>
        </span>
      </button>
    </div>
  </div>
</header>
