<!-- Lightbox (hidden by default): photos from the gallery, or a YouTube video inserted only when opened -->
<div class="lightbox" id="gallery-lightbox" role="dialog" aria-modal="true" aria-hidden="true" data-watch-label="{{copy.videos.watchOnYouTube}}" data-video-title="{{copy.videos.play}}">
  <button type="button" class="lightbox-close" aria-label="Close lightbox"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  <div class="lightbox-content">
    <img class="lightbox-img" src="" alt="">
  </div>
  <button type="button" class="lightbox-nav lightbox-prev" aria-label="Previous image"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg></button>
  <button type="button" class="lightbox-nav lightbox-next" aria-label="Next image"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></button>
</div>
