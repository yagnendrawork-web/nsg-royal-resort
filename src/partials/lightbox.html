<!-- Lightbox (hidden by default): photos from the gallery, or a YouTube video inserted only when opened -->
<div class="lightbox" id="gallery-lightbox" role="dialog" aria-modal="true" aria-hidden="true" data-watch-label="{{copy.videos.watchOnYouTube}}" data-video-title="{{copy.videos.play}}">
  <button type="button" class="lightbox-close" aria-label="Close lightbox">&times;</button>
  <div class="lightbox-content">
    <img class="lightbox-img" src="" alt="">
  </div>
  <button type="button" class="lightbox-nav lightbox-prev" aria-label="Previous image">&#8592;</button>
  <button type="button" class="lightbox-nav lightbox-next" aria-label="Next image">&#8594;</button>
</div>
