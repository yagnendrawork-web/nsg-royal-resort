<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{seo.404.title}}</title>
  <meta name="description" content="{{seo.404.description}}">
  <meta name="robots" content="noindex">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{seo.404.title}}">
  <meta property="og:description" content="{{seo.404.description}}">
  <meta property="og:image" content="assets/img/{{seo.404.ogImage}}">

  <!-- Preload Critical Fonts -->
  <link rel="preload" href="assets/fonts/cormorant-garamond-600.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/inter-600.woff2" as="font" type="font/woff2" crossorigin>

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/print.css" media="print">
  <noscript>
    <style>.reveal { opacity: 1 !important; transform: none !important; }</style>
  </noscript>

  <!-- Scripts -->
  <script src="js/config.js" defer></script>
  <script src="js/content.ui.js" defer></script>
  <script src="js/api.js" defer></script>
  <script src="js/site.js" defer></script>
</head>
<body class="page-404">
  <!-- Accessibility Skip Link -->
  <a href="#main-content" class="skip-link">{{copy.common.skipToMainContent}}</a>

  <!-- Header Partial -->
  {{include:header}}

  <main id="main-content">
    <!-- 404 Section -->
    <section class="section bg-ivory" id="not-found" aria-labelledby="not-found-title">
      <div class="container">
        <header class="section-header reveal">
          <span class="section-tag">404</span>
          <h1 id="not-found-title" class="section-title">{{notFound.heroTitle}}</h1>
          <hr class="gold-hairline" aria-hidden="true">
          <p class="section-subtitle">{{notFound.subtitle}}</p>
        </header>
        <div class="actions-wrap reveal" style="text-align:center; margin-top: var(--space-8);">
          <a href="index.html" class="btn btn-primary btn-md">{{notFound.ctaHome}}</a>
          <a href="book.html" class="btn btn-secondary btn-md">{{notFound.ctaBook}}</a>
        </div>
      </div>
    </section>
  </main>

  <!-- Footer Partial -->
  {{include:footer}}

  <!-- Sticky Mobile Bar Partial -->
  {{include:sticky-bar}}
</body>
</html>
